apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mediplus
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ZORROamith/mediplus-devsecops.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: mediplus
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
